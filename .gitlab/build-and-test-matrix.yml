default:
  id_tokens:
     SITE_ID_TOKEN:
        aud: https://lc.llnl.gov/gitlab

stages:
  - build

include:
  local: "/.gitlab/build-and-test-common.yml"

gcc-13-3-1-cuda-12-9-1-matrix:
  variables:
    COMPILER_FAMILY: gnu
    MODULES: "gcc/11.2.1 mvapich2/2.3.7 cuda/12.9.1 cmake/3.30.5 python/3.12.2"
  extends: .build-and-test-on-matrix

clang-19-1-3-cuda-12-9-1-matrix:
  variables:
    COMPILER_FAMILY: clang
    MODULES: "clang/19.1.3 mvapich2/2.3.7 cuda/12.9.1 cmake/3.30.5 python/3.12.2"
  extends: .build-and-test-on-matrix

.build-and-test-on-matrix:
  stage: build
  tags: [matrix, batch]
  extends: .build-and-test
