include:
  - project: 'lc-templates/id_tokens'
    file: 'id_tokens.yml'

stages:
  - run-all-clusters

matrix testing:
  stage: run-all-clusters
  trigger:
    strategy: depend
    include: '.gitlab/build-and-test-matrix.yml'
    forward:
      pipeline_variables: true

corona testing:
  stage: run-all-clusters
  trigger:
    strategy: depend
    include: '.gitlab/build-and-test-corona.yml'
    forward:
      pipeline_variables: true

tioga testing:
  stage: run-all-clusters
  trigger:
    strategy: depend
    include: '.gitlab/build-and-test-tioga.yml'
    forward:
      pipeline_variables: true

tuo testing:
  stage: run-all-clusters
  trigger:
    strategy: depend
    include: '.gitlab/build-and-test-tuo.yml'
    forward:
      pipeline_variables: true
